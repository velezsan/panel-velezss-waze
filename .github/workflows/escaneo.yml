name: Escaneo de segmentos sin nombre

on:
  schedule:
    - cron: '17 */2 * * *'   # cada 2 horas: corridas cortas y seguidas.
    # GitHub retrasa y hasta descarta los disparos programados cuando el
    # repo pesa mucho. Antes eran 210 min de cada 240 (87% ocupado) y se
    # saltaba la mitad de las corridas, con huecos de 7 a 14 horas. Con
    # 100 min de cada 120 hay holgura, y si GitHub se salta un disparo el
    # siguiente entra 2 horas después en vez de 4.
  workflow_dispatch:
    inputs:
      modo:
        description: 'Modo de escaneo'
        type: choice
        default: completo
        options: [test, completo]
      minutos:
        description: 'Duración máxima en minutos'
        default: '210'
      zona:
        description: 'Re-escaneo prioritario: estado, "lat,lon" o bbox (vacío = barrido normal)'
        default: ''

permissions:
  contents: write

concurrency:
  group: escaneo
  cancel-in-progress: false

jobs:
  escanear:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial completo: evita conflictos falsos al hacer rebase

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests

      - name: Marca de inicio
        run: echo "INICIO=$(date +%s)" >> "$GITHUB_ENV"

      - name: Correr escáner
        run: |
          python scanner/scan.py \
            --modo "${{ github.event.inputs.modo || 'completo' }}" \
            --minutos "${{ github.event.inputs.minutos || '210' }}" \
            --zona="${{ github.event.inputs.zona || '' }}"

      - name: Guardar resultados
        run: |
          git config user.name "escaner-bot"
          git config user.email "actions@users.noreply.github.com"
          git rebase --abort 2>/dev/null || true
          # Sin rebase: la rama se coloca sobre origin y se vuelven a marcar solo
          # las rutas de este panel. El rebase fallaba ("unstaged changes") porque
          # el árbol conserva copias viejas de los archivos del otro escáner.
          ok=0
          for i in 1 2 3 4 5; do
            git fetch origin ${GITHUB_REF_NAME} || { sleep 10; continue; }
            git reset --mixed origin/${GITHUB_REF_NAME}
            for p in docs/data state/scan_state.json state/last_run.json state/debug_ultimo_error.txt; do
              git add -A "$p" 2>/dev/null || true
            done
            if git diff --cached --quiet; then
              echo "Sin cambios que guardar"; ok=1; break
            fi
            git commit -m "Escaneo automático $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push origin HEAD:${GITHUB_REF_NAME}; then ok=1; break; fi
            sleep 10
          done
          [ "$ok" = "1" ]

      - name: Encadenar la siguiente corrida
        # GitHub no crea los disparos programados de este repo con fiabilidad
        # (se salta la mayoría y los que entran llegan a horas arbitrarias),
        # así que cada corrida lanza la siguiente al terminar. El token que
        # traen los flujos por defecto tiene prohibido lanzar otros flujos,
        # por eso hace falta el secreto TOKEN_ESCANEO.
        if: always()
        # Nunca debe tumbar la corrida: el escaneo ya hizo su trabajo y guardó.
        # Si el encadenado falla (token sin permiso, vencido, o GitHub de malas)
        # se avisa en el log y ya, que el cron haga de respaldo.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.TOKEN_ESCANEO }}
          FLUJO: escaneo.yml
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Sin TOKEN_ESCANEO: no se encadena. El cron queda de respaldo."
            exit 0
          fi
          # Freno de seguridad: si la corrida duró menos de 10 minutos algo
          # salió mal, y encadenar sería un bucle. Mejor dejar que entre el cron.
          DURACION=$(( $(date +%s) - ${INICIO:-0} ))
          if [ "$DURACION" -lt 600 ]; then
            echo "La corrida duró ${DURACION}s (menos de 10 min): no se encadena."
            exit 0
          fi
          if gh workflow run "$FLUJO" --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"; then
            echo "Siguiente corrida lanzada."
          else
            echo "No se pudo encadenar. Si dice 403, al token le falta el permiso"
            echo "Actions: Read and write sobre este repo. El cron queda de respaldo."
          fi
