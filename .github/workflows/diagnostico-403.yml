name: Diagnostico 403

# Prueba temporal: que cabecera hace que Waze rechace al escaner en las maquinas Linux.
# Cada variante corre en una maquina aparte para que no se contaminen entre si.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnostico-403.yml'

permissions:
  contents: read

jobs:
  probar:
    strategy:
      fail-fast: false
      matrix:
        variante: [honesto, chrome, honesto_xrw, chrome_xrw]
        intento: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probar
        shell: bash
        env:
          VARIANTE: ${{ matrix.variante }}
        run: |
          python -m pip install --quiet requests
          python - <<'EOF'
          import os
          import requests
          V = os.environ.get("VARIANTE", "honesto")
          CHROME = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                    "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36")
          HONESTO = "panel-velezss-waze (github.com/velezsan/panel-velezss-waze)"
          BASE = {"Accept": "application/json, text/javascript, */*; q=0.01",
                  "Accept-Language": "es-MX,es;q=0.9,en;q=0.8",
                  "Referer": "https://www.waze.com/editor"}
          H = dict(BASE)
          H["User-Agent"] = CHROME if V.startswith("chrome") else HONESTO
          if V.endswith("_xrw"):
              H["X-Requested-With"] = "XMLHttpRequest"
          LIMPIO = dict(BASE)
          LIMPIO["User-Agent"] = HONESTO
          P = {"bbox": "-99.14,19.42,-99.13,19.43", "language": "es-419",
               "sandbox": "true", "roadTypes": "1"}
          ROW = "https://www.waze.com/row-Descartes/app/Features"
          OUT = []

          def probar(nombre, headers):
              try:
                  r = requests.get(ROW, params=P, headers=headers, timeout=40)
                  OUT.append(f"{nombre}={r.status_code}")
              except Exception as e:
                  OUT.append(f"{nombre}=EXC {type(e).__name__}")

          try:
              j = requests.get("https://ipinfo.io/json", timeout=20).json()
              ip = (j.get("ip") or "").split(".")
              OUT.append(f"egreso={'.'.join(ip[:2])}.x.x {j.get('region')}")
          except Exception as e:
              OUT.append(f"egreso=EXC {type(e).__name__}")

          probar("primera", H)
          probar("segunda", H)
          probar("despues_limpia", LIMPIO)
          print("::notice title=RESULTADO " + V + "::" + " ; ".join(OUT))
          EOF
