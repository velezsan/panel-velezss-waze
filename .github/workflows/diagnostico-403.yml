name: Diagnostico 403

# Prueba temporal: desde que maquinas de GitHub responde Waze y desde cuales no.
# Hace unas cuantas peticiones chicas y termina. Se puede borrar cuando ya no sirva.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnostico-403.yml'

permissions:
  contents: read

jobs:
  probar:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest]
        intento: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probar
        shell: bash
        env:
          MAQUINA: ${{ matrix.os }}
        run: |
          python -m pip install --quiet requests
          python - <<'EOF'
          import os
          import requests
          H = {"User-Agent": "panel-velezss-waze (github.com/velezsan/panel-velezss-waze)",
               "Accept": "application/json, text/javascript, */*; q=0.01",
               "Accept-Language": "es-MX,es;q=0.9,en;q=0.8",
               "Referer": "https://www.waze.com/editor"}
          P = {"bbox": "-99.14,19.42,-99.13,19.43", "language": "es-419",
               "sandbox": "true", "roadTypes": "1"}
          ROW = "https://www.waze.com/row-Descartes/app/Features"
          USA = "https://www.waze.com/Descartes/app/Features"
          OUT = []

          def probar(nombre, url, params=None):
              try:
                  r = requests.get(url, params=params, headers=H, timeout=40)
                  OUT.append(f"{nombre}={r.status_code}")
              except Exception as e:
                  OUT.append(f"{nombre}=EXC {type(e).__name__}")

          try:
              j = requests.get("https://ipinfo.io/json", timeout=20).json()
              ip = (j.get("ip") or "").split(".")
              OUT.append(f"egreso={'.'.join(ip[:2])}.x.x {j.get('region')}")
          except Exception as e:
              OUT.append(f"egreso=EXC {type(e).__name__}")

          probar("row", ROW, P)
          probar("usa", USA, dict(P, bbox="-117.03,32.52,-117.02,32.53"))
          print("::notice title=RESULTADO " + os.environ.get("MAQUINA", "?") + "::" + " ; ".join(OUT))
          EOF
