name: Diagnostico de conexion con Waze

# Herramienta manual (no corre sola): compara desde que maquinas de GitHub responde
# la API de Waze. Sirvio para descubrir que con "ubuntu-latest" (Ubuntu 26.04,
# OpenSSL 3.5) Waze contesta 403, mientras que con ubuntu-24.04 y 22.04 contesta bien.
# Si algun dia el escaner vuelve a recibir 403, correr esto desde la pestana Actions
# y leer los avisos "RESULTADO" del run.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probar:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probar
        shell: bash
        env:
          MAQUINA: ${{ matrix.os }}
        run: |
          python -m pip install --quiet requests
          python - <<'EOF'
          import os, ssl, platform
          import requests
          H = {"User-Agent": "panel-velezss-waze (github.com/velezsan/panel-velezss-waze)",
               "Accept": "application/json, text/javascript, */*; q=0.01",
               "Referer": "https://www.waze.com/editor"}
          P = {"bbox": "-99.14,19.42,-99.13,19.43", "language": "es-419",
               "sandbox": "true", "roadTypes": "1"}
          OUT = []
          try:
              OUT.append("so=" + platform.freedesktop_os_release().get("PRETTY_NAME", "?"))
          except Exception:
              OUT.append("so=?")
          OUT.append("openssl=" + ssl.OPENSSL_VERSION)
          for nombre, url in (("row", "https://www.waze.com/row-Descartes/app/Features"),
                              ("usa", "https://www.waze.com/Descartes/app/Features")):
              try:
                  r = requests.get(url, params=P, headers=H, timeout=40)
                  OUT.append(f"{nombre}={r.status_code}")
              except Exception as e:
                  OUT.append(f"{nombre}=EXC {type(e).__name__}")
          print("::notice title=RESULTADO " + os.environ.get("MAQUINA", "?") + "::" + " ; ".join(OUT))
          EOF
