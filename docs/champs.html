<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local Champs · velezss ROW</title>
<style>
  :root{
    --bg:#0f1420; --panel:#171e2e; --panel2:#1d2639; --line:#2a3550;
    --text:#e8ecf4; --muted:#93a0b8; --accent:#4da3ff; --accent2:#7fd18c;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--text);line-height:1.45}
  header{padding:24px 20px 8px;max-width:900px;margin:0 auto}
  h1{margin:0 0 4px;font-size:1.3rem;font-weight:700}
  .sub{color:var(--muted);font-size:.92rem;margin:0}
  .sub a{color:var(--accent);text-decoration:none}
  main{max-width:900px;margin:0 auto;padding:14px 20px 50px}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);
        border-radius:12px;overflow:hidden;font-size:.95rem}
  th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line)}
  th{background:var(--panel2);color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
  tr:last-child td{border-bottom:none}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .barra{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;min-width:120px}
  .barra i{display:block;height:100%;background:var(--accent);border-radius:4px}
  .chip{display:inline-block;background:#243049;border-radius:6px;padding:2px 8px;font-size:.78rem;color:var(--muted);margin-left:8px}
  .cargando{color:var(--muted);padding:40px;text-align:center}
  .nota{color:var(--muted);font-size:.85rem;margin-top:14px}
  .pos{color:var(--muted);width:36px}
  td.foro{color:var(--muted);font-size:.88rem;white-space:nowrap;text-align:right}
  td.foro b{color:var(--text);font-weight:600}
  td.foro.cero{opacity:.35}
  th .aclara{display:block;font-weight:400;font-size:.72rem;color:var(--muted);text-transform:none}
</style>
</head>
<body>
<header>
  <h1>🏆 Local Champs</h1>
  <p class="sub">Lo que cada Local Champ hizo en los últimos 60 días: segmentos editados en el mapa
    y actividad en el foro de México ·
    <a href="index.html">← Volver al panel</a></p>
</header>
<main>
  <div id="contenido"><div class="cargando">Cargando datos…</div></div>
  <p class="nota" id="nota" style="display:none"></p>
</main>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const fmt=n=>n.toLocaleString('es-MX');
  const pide=u=>fetch(u,{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null);
  Promise.all([pide('data/champs.json'), pide('data/foro.json')])
    .then(([d,f])=>{
      if(!d){
        $('contenido').innerHTML='<div class="cargando">Los datos se generan con las corridas del escáner. Si esta sección es nueva, estará disponible después de la próxima corrida.</div>';
        return;
      }
      const ediciones=d.totales||{};
      const foro=(f&&f.champs)||{};
      // los dos lados usan el mismo apodo, pero no siempre con las mismas mayúsculas
      const porClave={};
      Object.keys(ediciones).forEach(n=>{porClave[n.toLowerCase()]={nombre:n, seg:ediciones[n], foro:null};});
      Object.keys(foro).forEach(n=>{
        const k=n.toLowerCase();
        if(!porClave[k]) porClave[k]={nombre:n, seg:0, foro:null};
        porClave[k].foro=foro[n];
      });
      const filas=Object.values(porClave).sort((a,b)=>b.seg-a.seg||a.nombre.localeCompare(b.nombre,'es'));
      if(!filas.length){
        $('contenido').innerHTML='<div class="cargando">Aún no hay actividad registrada. El conteo crece con cada corrida del escáner.</div>';
        return;
      }
      const max=filas[0].seg||1;
      const suma=filas.reduce((a,x)=>a+x.seg,0);
      const celdaForo=s=>{
        if(!s) return '<td class="foro cero" title="Sin datos del foro todavía">—</td>';
        const vacia=(s.temas||0)+(s.respuestas||0)===0;
        return `<td class="foro${vacia?' cero':''}" title="${s.temas||0} tema${(s.temas||0)===1?'':'s'} · ${s.respuestas||0} respuesta${(s.respuestas||0)===1?'':'s'}">`+
               `<b>${fmt(s.temas||0)}</b> · ${fmt(s.respuestas||0)}</td>`;
      };
      let html='<table><thead><tr><th></th><th>Local Champ</th><th class="num">Segmentos editados</th>'+
        '<th class="num">Desbloqueos<span class="aclara">temas · respuestas</span></th>'+
        '<th class="num">Otras secciones<span class="aclara">temas · respuestas</span></th>'+
        '<th></th></tr></thead><tbody>';
      filas.forEach((r,i)=>{
        html+=`<tr><td class="pos">${i+1}</td>`+
          `<td><a href="https://www.waze.com/user/editor/${encodeURIComponent(r.nombre)}" target="_blank" rel="noopener" style="color:var(--text);text-decoration:none">${r.nombre}</a>${i===0&&r.seg>0?' <span class="chip">líder</span>':''}</td>`+
          `<td class="num">${fmt(r.seg)}</td>`+
          celdaForo(r.foro&&r.foro.desbloqueos)+
          celdaForo(r.foro&&r.foro.otras)+
          `<td><div class="barra"><i style="width:${Math.max(3,Math.round(100*r.seg/max))}%"></i></div></td></tr>`;
      });
      html+='</tbody></table>';
      $('contenido').innerHTML=html;
      const act=d.actualizado?new Date(d.actualizado).toLocaleString('es-MX',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):'—';
      const actF=f&&f.actualizado?new Date(f.actualizado).toLocaleString('es-MX',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):null;
      $('nota').textContent=`Total: ${fmt(suma)} segmentos editados por Local Champs (últimos ${d.ventana_dias||60} días) · `+
        `cobertura: ${d.porcentaje_pais!=null?d.porcentaje_pais+'% del país escaneado':'en construcción'} · actualizado ${act} (tu hora)`+
        (actF?` · foro revisado ${actF}`:' · el foro se revisa una vez al día.');
    });
})();
</script>
<script>
// columnas extra: places editados (escaner) y URs cerrados (cosecha de URs)
(async () => {
  const fmt = n => (n === undefined || n === null) ? "\u2014" : Number(n).toLocaleString("es-MX");
  const baja = async u => { try { const r = await fetch(u + "?v=" + Date.now(), {cache:"no-store"}); return r.ok ? await r.json() : null; } catch (e) { return null; } };
  const [cj, uj] = await Promise.all([baja("data/champs.json"), baja("urs-datos.json")]);
  const mapa = o => { const m = {}; for (const k in (o || {})) m[k.toLowerCase()] = o[k]; return m; };
  const places = mapa(cj && cj.places);
  const cerrados = mapa(uj && uj.cerradosPorChamp);
  let intentos = 0;
  const reloj = setInterval(() => {
    const filas = document.querySelectorAll("tbody tr");
    if (!filas.length) { if (++intentos > 40) clearInterval(reloj); return; }
    clearInterval(reloj);
    const cab = document.querySelector("thead tr");
    if (!cab || cab.children.length < 3 || cab.dataset.extra) return;
    cab.dataset.extra = "1";
    const modelo = cab.children[2];
    let refTh = modelo;
    ["Places editados", "URs cerrados (40 d)"].forEach(txt => {
      const th = document.createElement("th");
      th.className = modelo.className;
      th.textContent = txt;
      refTh.parentNode.insertBefore(th, refTh.nextSibling);
      refTh = th;
    });
    filas.forEach(tr => {
      const celdaSeg = tr.children[2];
      if (!celdaSeg) return;
      const nombre = (tr.children[1].textContent || "").trim().split(/\s+/)[0].toLowerCase();
      let ref = celdaSeg;
      [places[nombre], cerrados[nombre]].forEach(v => {
        const td = document.createElement("td");
        td.className = celdaSeg.className;
        td.textContent = fmt(v);
        ref.parentNode.insertBefore(td, ref.nextSibling);
        ref = td;
      });
    });
    const nota = document.getElementById("nota");
    if (nota) nota.append(" Los places editados salen del mismo recorrido del escáner, con la misma ventana y el mismo criterio que los segmentos: cuentan los places cuya última edición es del champ. Los URs cerrados salen de la cosecha de URs, que solo alcanza a ver los últimos 30 días, y se cuentan por el último editor del UR.");
  }, 300);
})();
</script>
</body>
</html>
